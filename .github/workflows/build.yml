name: build

on: [ push, pull_request ]

jobs:
  default:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v5
        with:
          name: 64k-starter
          path: target/release/starter.exe
          if-no-files-found: error
